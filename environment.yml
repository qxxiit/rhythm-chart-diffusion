      - soundfile>=0.12.1
      - hydra-core>=1.3.2
      - omegaconf>=2.3.0
      - wandb>=0.16.0
      - pyarrow>=14.0.0
      - tqdm>=4.66.0
      - requests>=2.31.0
      - ruff>=0.1.0
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
      - pre-commit>=3.5.0
      - einops>=0.7.0
      - rich>=13.0.0
